<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="14">
  <rect width="760" height="430" rx="10" fill="#1b1e27"/>
  <rect width="760" height="34" rx="10" fill="#2b2f3a"/>
  <rect y="22" width="760" height="12" fill="#2b2f3a"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="380" y="22" fill="#8b93a7" text-anchor="middle" font-size="12">gogen — Go project scaffolder</text>

  <text x="20" y="68" xml:space="preserve"><tspan fill="#27c93f">$</tspan><tspan fill="#e6e9ef"> gogen --module github.com/acme/shop --arch </tspan><tspan fill="#ffd479">monolith</tspan><tspan fill="#e6e9ef"> \</tspan></text>
  <text x="36" y="90" xml:space="preserve"><tspan fill="#e6e9ef">--router </tspan><tspan fill="#ffd479">chi</tspan><tspan fill="#e6e9ef"> --entity </tspan><tspan fill="#7fd1ff">User</tspan><tspan fill="#e6e9ef"> --entity </tspan><tspan fill="#7fd1ff">Product</tspan></text>

  <text x="20" y="120" fill="#27c93f" xml:space="preserve">✅ Scaffolded "github.com/acme/shop" (monolith architecture, chi router) at ./shop</text>

  <text x="20" y="152" fill="#8b93a7" xml:space="preserve">shop/</text>
  <text x="20" y="172" fill="#8b93a7" xml:space="preserve">├── cmd/server/main.go            <tspan fill="#5b6275"># wires every context onto /api/v1</tspan></text>
  <text x="20" y="192" fill="#8b93a7" xml:space="preserve">├── internal/</text>
  <text x="20" y="212" fill="#8b93a7" xml:space="preserve">│   ├── shared/</text>
  <text x="20" y="232" fill="#8b93a7" xml:space="preserve">│   ├── <tspan fill="#7fd1ff">user</tspan>/           <tspan fill="#5b6275"># bounded context</tspan></text>
  <text x="20" y="252" fill="#8b93a7" xml:space="preserve">│   │   ├── domain/{entity,repository}/</text>
  <text x="20" y="272" fill="#8b93a7" xml:space="preserve">│   │   ├── application/</text>
  <text x="20" y="292" fill="#8b93a7" xml:space="preserve">│   │   ├── infrastructure/postgres/</text>
  <text x="20" y="312" fill="#8b93a7" xml:space="preserve">│   │   └── transport/http/v1/{handlers,routes,dto}/</text>
  <text x="20" y="332" fill="#8b93a7" xml:space="preserve">│   └── <tspan fill="#7fd1ff">product</tspan>/        <tspan fill="#5b6275"># same structure</tspan></text>
  <text x="20" y="352" fill="#8b93a7" xml:space="preserve">├── config/  pkg/{db,logger}/  migrations/</text>
  <text x="20" y="372" fill="#8b93a7" xml:space="preserve">└── Dockerfile  Taskfile.yaml  .env.example  README.md  go.mod</text>

  <text x="20" y="404" xml:space="preserve"><tspan fill="#27c93f">$</tspan><tspan fill="#e6e9ef"> cd shop &amp;&amp; go run ./cmd/server</tspan><tspan fill="#5b6275">   # API on :8080 under /api/v1</tspan></text>
</svg>
