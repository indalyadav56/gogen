run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/indalyadav56/gogen

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
